    <script>
      // Workaround for environments where window.fetch is a read-only getter property
      (function() {
        try {
          const originalFetch = window.fetch;
          if (originalFetch) {
            let currentFetch = originalFetch;
            
            const descriptor = {
              get() {
                return currentFetch;
              },
              set(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            };

            // Define on window
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e) {
              console.warn("Could not redefine fetch on window:", e);
            }

            // Define on globalThis if available
            if (typeof globalThis !== 'undefined') {
              try {
                Object.defineProperty(globalThis, 'fetch', descriptor);
              } catch (e) {
                console.warn("Could not redefine fetch on globalThis:", e);
              }
            }

            // Define on self if available
            if (typeof self !== 'undefined') {
              try {
                Object.defineProperty(self, 'fetch', descriptor);
              } catch (e) {
                console.warn("Could not redefine fetch on self:", e);
              }
            }
          }
        } catch (err) {
          console.error("Failed to run fetch getter/setter workaround:", err);
        }
      })();
    </script>
